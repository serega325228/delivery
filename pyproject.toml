[project]
name = "delivery"
version = "0.1.0"
description = "Console, FastAPI and Streamlit delivery service simulator"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.116,<1",
    "pydantic>=2.11,<3",
    "requests>=2.32,<3",
    "sqlalchemy>=2.0,<3",
    "streamlit>=1.49,<2",
    "uvicorn>=0.35,<1",
]

[project.scripts]
delivery-cli = "app.console.cli:run"

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
